<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="FLIPR SCORE">
  <title>FLIPR SCORE™</title>
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="vh" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" fill="#090A0F"/>
  <rect width="360" height="360" fill="url(#vh)"/>
  <!-- isotipo grande -->
  <g transform="translate(80 40)">
    <rect width="200" height="200" rx="44" fill="url(#vbg)"/>
    <path d="M134 50 L70 130 H118 L100 178 L182 110 H134 Z" fill="#090A0F" stroke="#090A0F" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="180" y="290" font-family="'JetBrains Mono','Plus Jakarta Sans',ui-monospace,monospace" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">FLIPR</text>
  <!-- sello SCORE -->
  <g transform="translate(180 320)">
    <rect x="-90" y="-18" width="180" height="36" rx="8" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="0" y="6" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="18" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="3">SCORE™</text>
  </g>
</svg>
