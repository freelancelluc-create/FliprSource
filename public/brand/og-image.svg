<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="FLIPR — ¿Lo compro o no?">
  <title>FLIPR — ¿Lo compro o no?</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid sutil -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1F2937" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1F2937" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1F2937" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1F2937" stroke-width="1"/>

  <!-- Glow central -->
  <ellipse cx="600" cy="315" rx="380" ry="200" fill="url(#glow-grad)"/>

  <!-- Isotipo grande centrado arriba -->
  <g transform="translate(510, 80)">
    <rect width="180" height="180" rx="38" fill="url(#accent)" filter="url(#glow)"/>
    <path d="M122 44 L64 116 H104 L90 166 L162 94 H122 Z" fill="#090A0F" stroke="#090A0F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- FLIPR wordmark -->
  <text
    x="600" y="340"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="900"
    font-size="120"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-3"
    filter="url(#soft-glow)"
  >FLIPR</text>

  <!-- Sello SCORE™ -->
  <rect x="718" y="300" width="164" height="34" rx="8" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="800" y="323" font-family="'JetBrains Mono', monospace" font-size="18" fill="#10B981" text-anchor="middle" font-weight="700" letter-spacing="3">SCORE™</text>

  <!-- Claim -->
  <text
    x="600" y="400"
    font-family="'Plus Jakarta Sans', system-ui, sans-serif"
    font-size="28"
    fill="#9CA3AF"
    text-anchor="middle"
    letter-spacing="6"
    font-weight="500"
  >¿LO COMPRO O NO?</text>

  <!-- Tres verdicts -->
  <g transform="translate(190, 470)">
    <!-- CÓMPRALO -->
    <rect width="220" height="52" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="110" y="33" font-family="'JetBrains Mono', monospace" font-size="18" fill="#34D399" text-anchor="middle" font-weight="800" letter-spacing="1">■ CÓMPRALO</text>
  </g>
  <g transform="translate(490, 470)">
    <!-- NEGOCIA -->
    <rect width="220" height="52" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="110" y="33" font-family="'JetBrains Mono', monospace" font-size="18" fill="#FBBF24" text-anchor="middle" font-weight="800" letter-spacing="1">■ NEGOCIA</text>
  </g>
  <g transform="translate(790, 470)">
    <!-- PASA -->
    <rect width="220" height="52" rx="12" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="110" y="33" font-family="'JetBrains Mono', monospace" font-size="18" fill="#F87171" text-anchor="middle" font-weight="800" letter-spacing="1">■ PASA</text>
  </g>

  <!-- URL -->
  <text
    x="600" y="590"
    font-family="'JetBrains Mono', monospace"
    font-size="18"
    fill="#4B5563"
    text-anchor="middle"
    letter-spacing="2"
  >fliprscore.com</text>
</svg>
